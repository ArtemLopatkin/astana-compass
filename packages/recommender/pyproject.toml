[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "astana-recommender"
version = "0.1.0"
description = "Grounded, constraint-aware recommendation orchestration for Astana Compass"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["astana-contracts>=0.1.0,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/astana_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
