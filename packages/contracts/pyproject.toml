[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "astana-contracts"
version = "0.1.0"
description = "Canonical validated boundary contracts for Astana Compass"
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema[format-nongpl]==4.26.0"]

[project.scripts]
astana-verify-contracts = "astana_contracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astana_contracts"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md"]
