name: astana-compass
services:
  api:
    image: astana-compass:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ASTANA_MODE: fixture
      LLM_PROVIDER: none
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4

  postgres:
    # Optional future-adapter dependency. Fixture API does not require this service.
    profiles: ["database"]
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: astana
      POSTGRES_USER: astana
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres_data:
